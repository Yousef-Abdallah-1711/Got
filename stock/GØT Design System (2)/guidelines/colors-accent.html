<!-- @dsCard group="Colors" viewport="700x150" name="Accent — Acid Lime (proposed)" subtitle="Fills with dark text; --accent-ink for text/lines; silver fallback via data-accent" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:0}.g{display:grid;grid-template-columns:1fr 1fr}.g>div{padding:18px;background:var(--got-bg);color:var(--got-text);display:flex;flex-direction:column;gap:10px}.k{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--got-text-muted)}</style></head><body><div class="g"><div data-theme="dark"><div style="display:flex;gap:8px;align-items:center"><span class="got-btn got-btn--primary">Order now</span><span class="hm-chip" style="background:var(--accent);color:var(--on-accent);font-family:var(--font-mono);font-size:11px;padding:6px 10px;letter-spacing:.12em;text-transform:uppercase">Drop 01</span><span style="font-family:var(--font-mono);color:var(--accent-ink);font-size:20px">01</span></div><span class="k">--accent #C2FF3D · --accent-ink #C2FF3D · focus lime</span><span class="got-small">Proposed — needs brand approval</span></div><div data-theme="light"><div style="display:flex;gap:8px;align-items:center"><span class="got-btn got-btn--primary">Order now</span><span class="hm-chip" style="background:var(--accent);color:var(--on-accent);font-family:var(--font-mono);font-size:11px;padding:6px 10px;letter-spacing:.12em;text-transform:uppercase">Drop 01</span><span style="font-family:var(--font-mono);color:var(--accent-ink);font-size:20px">01</span></div><span class="k">--accent #C2FF3D · --accent-ink #3D5200 · focus black</span><span class="got-small">Proposed — needs brand approval</span></div></div></body></html>
