<!-- @dsCard group="Effects" viewport="700x150" name="Motion" subtitle="Precise, mechanical: cubic-bezier(.2,.7,.2,1); 150 / 280 / 500ms; reduced-motion → 0" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px}.k{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--got-text-muted)}.bar{position:absolute;inset:0;width:30%;background:var(--got-text);animation:mv 1.8s cubic-bezier(.2,.7,.2,1) infinite alternate}@keyframes mv{to{transform:translateX(233%)}}</style></head><body><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px"><div style="border:1px solid var(--got-border);padding:14px;display:flex;flex-direction:column;gap:8px"><span class="got-label">Control</span><span class="got-price" style="font-size:20px">150ms</span><span class="got-small">hover, press, ticks</span><div style="height:2px;background:var(--got-border);position:relative;overflow:hidden"><div class="bar" style="animation-duration:1.2s"></div></div></div><div style="border:1px solid var(--got-border);padding:14px;display:flex;flex-direction:column;gap:8px"><span class="got-label">Panel</span><span class="got-price" style="font-size:20px">280ms</span><span class="got-small">drawer, modal, toast</span><div style="height:2px;background:var(--got-border);position:relative;overflow:hidden"><div class="bar" style="animation-duration:1.8s"></div></div></div><div style="border:1px solid var(--got-border);padding:14px;display:flex;flex-direction:column;gap:8px"><span class="got-label">Reveal</span><span class="got-price" style="font-size:20px">500ms</span><span class="got-small">one-time editorial</span><div style="height:2px;background:var(--got-border);position:relative;overflow:hidden"><div class="bar" style="animation-duration:2.6s"></div></div></div></div></body></html>
