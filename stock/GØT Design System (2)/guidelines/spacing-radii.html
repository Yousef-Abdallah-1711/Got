<!-- @dsCard group="Spacing" viewport="700x140" name="Radii & borders" subtitle="0 / 2 / 4px, pill only for tiny tags; 1px rules, 2px focus" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px}.k{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--got-text-muted)}</style></head><body><div style="display:flex;gap:20px;align-items:center"><div style="display:flex;flex-direction:column;gap:8px"><div style="width:96px;height:56px;border:1px solid var(--got-border-strong);border-radius:var(--radius-0);background:var(--got-surface)"></div><span class="k" style="font-size:10px">0</span></div><div style="display:flex;flex-direction:column;gap:8px"><div style="width:96px;height:56px;border:1px solid var(--got-border-strong);border-radius:var(--radius-control);background:var(--got-surface)"></div><span class="k" style="font-size:10px">2px control</span></div><div style="display:flex;flex-direction:column;gap:8px"><div style="width:96px;height:56px;border:1px solid var(--got-border-strong);border-radius:var(--radius-card);background:var(--got-surface)"></div><span class="k" style="font-size:10px">4px card</span></div><div style="display:flex;flex-direction:column;gap:8px"><div style="width:96px;height:56px;border:1px solid var(--got-border-strong);border-radius:var(--radius-pill);background:var(--got-surface)"></div><span class="k" style="font-size:10px">pill tag</span></div><div style="display:flex;flex-direction:column;gap:8px"><div style="width:96px;height:56px;border:1px solid var(--got-border);outline:2px solid var(--color-focus);outline-offset:2px;border-radius:2px"></div><span class="k" style="font-size:10px">focus 2px +2</span></div></div></body></html>
