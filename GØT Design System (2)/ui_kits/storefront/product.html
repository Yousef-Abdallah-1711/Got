<script type="text/babel" src="ComingSoon.jsx?v=20261008"></script>

<script type="text/babel" src="Home.jsx"></script>

<script type="text/babel">
const { Header, AnnouncementBar, Footer, CartDrawer, Notice, Button } = window.GTDesignSystem_f9e073;
function App() {
  const [screen, setScreen] = React.useState(window.__GOT_START || new URLSearchParams(window.location.search).get('screen') || localStorage.getItem('got-kit-screen') || 'home');
  const [theme, setThemeS] = React.useState(document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));
  const [product, setProduct] = React.useState(window.GOT_PRODUCTS[0]);
  const [cart, setCart] = React.useState([]);
  const [drawer, setDrawer] = React.useState(false);
  const [toast, setToast] = React.useState(null);
  const [order, setOrder] = React.useState(null);
  const [shopTab, setShopTab] = React.useState('All');
  const [menu, setMenu] = React.useState(false);
  const [search, setSearch] = React.useState(false);
  const wishlistStore = window.GOT_WISHLIST;
  const [wishIds, setWishIds] = React.useState(() => wishlistStore.read());
  const wishIdsRef = React.useRef(wishIds);
  const [wishError, setWishError] = React.useState('');
  const [retryWishIds, setRetryWishIds] = React.useState(null);
  const [showSlots, setShowSlots] = React.useState(false);
  const [compact, setCompact] = React.useState(false);
  const [accent, setAccent] = React.useState('lime');
  React.useEffect(() => { const s = () => setCompact(window.scrollY > 80); s(); window.addEventListener('scroll', s, { passive: true }); return () => window.removeEventListener('scroll', s); }, []);
  React.useEffect(() => { if (accent === 'lime') delete document.documentElement.dataset.accent; else document.documentElement.dataset.accent = accent; }, [accent]);
  React.useEffect(() => {
    const onStorage = e => { if (e.key !== wishlistStore.key) return; const next = wishlistStore.parse(e.newValue); wishIdsRef.current = next; setWishIds(next); setRetryWishIds(null); setWishError(''); };
    window.addEventListener('storage', onStorage);
    return () => window.removeEventListener('storage', onStorage);
  }, []);
  React.useEffect(() => { const onPopState = () => setScreen(new URLSearchParams(window.location.search).get('screen') || 'home'); window.addEventListener('popstate', onPopState); return () => window.removeEventListener('popstate', onPopState); }, []);
  const commitWishlist = next => {
    const normalized = wishlistStore.normalize(next);
    if (!wishlistStore.save(normalized)) { setRetryWishIds(normalized); setWishError('Your wishlist could not be saved on this device. Check browser storage and try again.'); return false; }
    wishIdsRef.current = normalized; setWishIds(normalized); setRetryWishIds(null); setWishError(''); return true;
  };
  const retryWishlistSave = () => { if (retryWishIds && commitWishlist(retryWishIds)) setWishMsg('Wishlist saved on this device.'); };
  const [wishMsg, setWishMsg] = React.useState('');
  const wish = p => ({ wishlisted: wishIds.includes(p.id), onWishlist: () => { const current = wishIdsRef.current; const has = current.includes(p.id); const next = has ? current.filter(id => id !== p.id) : [...current, p.id]; if (commitWishlist(next)) setWishMsg((has ? 'Removed ' + p.name + ' from' : 'Saved ' + p.name + ' to') + ' wishlist. ' + next.length + ' saved.'); } });
  const setTheme = t => { document.documentElement.dataset.theme = t; try { localStorage.setItem('got-theme', t); } catch (e) {} setThemeS(t); };
  React.useEffect(() => { document.documentElement.dataset.theme = theme; }, []);
  const go = (s, cat) => { if (s === 'shop') setShopTab(cat || 'All'); setScreen(s); setMenu(false); setSearch(false); setDrawer(false); try { localStorage.setItem('got-kit-screen', s); } catch (e) {} try { window.history.pushState({ screen: s }, '', '?screen=' + encodeURIComponent(s)); } catch (e) {} window.scrollTo(0, 0); };
  const openProduct = p => { setProduct(p); go('product'); };
  const addToCart = item => {
    setCart(c => { const ex = c.find(i => i.id === item.id); return ex ? c.map(i => i.id === item.id ? { ...i, qty: Math.min(i.max, i.qty + item.qty) } : i) : [...c, item]; });
    setDrawer(true); setToast(item);
    setTimeout(() => setToast(null), 3200);
  };
  const count = cart.reduce((a, i) => a + i.qty, 0);
  const nav = [{ label: 'Shop', key: 'shop' }, { label: 'Hoodies', key: 'shop', cat: 'Hoodies' }, { label: 'Accessories', key: 'shop', cat: 'Accessories' }, { label: 'About', key: 'home' }].map(n => ({ ...n, current: screen === 'shop' && n.key === 'shop' && (n.cat || 'All') === shopTab }));
  const screens = [['coming', 'Coming soon'], ['home', 'Home'], ['shop', 'Shop'], ['product', 'Product'], ['checkout', 'Checkout'], ['thanks', 'Thank you'], ['confirm', 'Tracking'], ['wishlist', 'Wishlist'], ['account', 'Account']];
  let body;
  if (screen === 'coming') body = <ComingSoon theme={theme} setTheme={setTheme} go={go} />;
  else {
    const inner = screen === 'home' ? <Home go={go} openProduct={openProduct} addToCart={addToCart} wish={wish} showSlots={showSlots} /> : screen === 'shop' ? <Shop key={shopTab} initialTab={shopTab} openProduct={openProduct} wish={wish} /> : screen === 'product' ? <Product key={product.id} product={product} addToCart={addToCart} go={go} openProduct={openProduct} wish={wish} /> : screen === 'checkout' ? <Checkout cart={cart} /> : screen === 'thanks' ? <ThankYou order={order} go={go} /> : screen === 'wishlist' ? <Wishlist ids={wishIds} products={window.GOT_PRODUCTS} wish={wish} go={go} openProduct={openProduct} addToCart={addToCart} clear={() => { if (commitWishlist([])) { setWishMsg('Wishlist cleared.'); return true; } return false; }} remove={id => commitWishlist(wishIdsRef.current.filter(x => x !== id))} /> : screen === 'account' ? <Account go={go} openProduct={openProduct} wishlist={window.GOT_PRODUCTS.filter(p => wishIds.includes(p.id))} wish={wish} /> : <Confirmation order={order} go={go} />;
    const checkout = screen === 'checkout';
    body = <>
      {!checkout && <AnnouncementBar messages={window.GOT_HOME.announcements} onSelect={m => m.key && go(m.key)} />}
      <Header mode={checkout ? 'checkout' : 'store'} layout="auto" sticky compact={compact} nav={nav} onNav={n => go(n.key, n.cat)} onMenu={() => setMenu(true)} cartCount={count} theme={theme} onToggleTheme={setTheme} onCart={() => setDrawer(true)} onLogo={() => go('home')} onSearch={() => setSearch(true)} wishCount={wishIds.length} onWishlist={() => go('wishlist')} onAccount={() => go('account')} />
      <div id="main">{inner}</div>
      {!checkout && <Footer onLink={() => go('shop')} />}
    </>;
  }
  return <>
    {body}
    <CartDrawer open={drawer} items={cart} onClose={() => setDrawer(false)} onQty={(id, q) => setCart(c => c.map(i => i.id === id ? { ...i, qty: q } : i))} onRemove={id => setCart(c => c.filter(i => i.id !== id))} onCheckout={() => go('checkout')} onViewCart={() => go('checkout')} onShop={() => go('shop')} />
    <div className="got-sr" aria-live="polite" role="status">{wishMsg}</div>
    {wishError && <div className="got-wishlist-error"><Notice tone="error" title="Wishlist not saved" action={<Button size="sm" variant="secondary" onClick={retryWishlistSave}>Retry</Button>}>{wishError}</Notice></div>}
    <MobileMenu open={menu} onClose={() => setMenu(false)} go={go} nav={nav} />
    <SearchOverlay open={search} onClose={() => setSearch(false)} openProduct={openProduct} wish={wish} />
    {toast && !drawer && <div style={{ position: 'fixed', right: 16, bottom: 72, zIndex: 80, width: 'min(360px, calc(100vw - 32px))' }}><Notice toast tone="success" title="Added to cart" onDismiss={() => setToast(null)}>{toast.name} — {toast.variant}</Notice></div>}
    <div className="kitnav" role="group" aria-label="UI kit screens"><span className="kit-status" aria-label="Prototype with sample store data">Preview · sample data</span>{screens.map(([k, l]) => <button key={k} aria-pressed={screen === k} onClick={() => go(k)}>{l}</button>)}<label className="kit-cms"><input type="checkbox" checked={accent === 'lime'} onChange={e => setAccent(e.target.checked ? 'lime' : 'silver')} />Lime accent</label>{screen === 'home' && <label className="kit-cms"><input type="checkbox" checked={showSlots} onChange={e => setShowSlots(e.target.checked)} />Show CMS slots</label>}</div>
  </>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
