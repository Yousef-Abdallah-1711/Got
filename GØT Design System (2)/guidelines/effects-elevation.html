<!-- @dsCard group="Effects" viewport="700x170" name="Elevation & scrims" subtitle="Flat by default; one panel shadow for overlays; bottom scrim on photos" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px}.k{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--got-text-muted)}</style></head><body><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:20px"><div style="display:flex;flex-direction:column;gap:8px"><div style="height:96px;background:var(--got-surface);border:1px solid var(--got-border)"></div><span class="k">Flat · 1px rule</span></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:96px;background:var(--got-surface);box-shadow:var(--shadow-panel)"></div><span class="k">--shadow-panel</span></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:96px;position:relative;background:repeating-linear-gradient(135deg,#2a2a2a 0 10px,#1c1c1c 10px 20px)"><div style="position:absolute;inset:0;background:var(--scrim-bottom)"></div><span class="got-label" style="position:absolute;left:10px;bottom:10px;color:var(--color-on-image)">On image</span></div><span class="k">--scrim-bottom</span></div></div></body></html>
